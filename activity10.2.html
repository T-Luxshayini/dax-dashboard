<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Arrays</h2>
<p>JavaScript array elements are accessed using numeric indexes (starting from 0).</p>
<p id="demo"></p>
<script>
var names = ["Saman", "Amara", "Seetha"];

names[2] = "Geetha";

names.push("Senhas");
names.push("Vanuja");

for (var i = 0; i < names.length; i++) {
    document.write(names[i] + "<br/>");
}
</script>
</body>
</html>
